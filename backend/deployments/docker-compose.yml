name: gembo

networks:
  gembo:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    networks: [gembo]
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    networks: [gembo]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gembo
      POSTGRES_PASSWORD: gembo
      POSTGRES_DB: gembo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gembo"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: collector
    networks: [gembo]
    environment:
      BYBIT_API_KEY: ${BYBIT_API_KEY}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET}
      OKX_API_KEY: ${OKX_API_KEY}
      OKX_API_SECRET: ${OKX_API_SECRET}
      OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE}
      # No CONFIG_PATH — all config via env vars.
      REDIS_ADDR: redis:6379
      EXCHANGES: bybit,okx
      LOG_LEVEL: debug
      LOG_FORMAT: json
      # Enable both exchanges.  Add BULLMQ_ENABLED=true here to test events.
      BULLMQ_ENABLED: "false"
      BULLMQ_QUEUE_PREFIX: gembo
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: api
    networks: [gembo]
    environment:
      REDIS_ADDR: redis:6379
      EXCHANGES: bybit,okx
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://gembo:gembo@postgres:5432/gembo?sslmode=disable
      LOG_LEVEL: debug
      LOG_FORMAT: json
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: worker
    networks: [gembo]
    environment:
      REDIS_ADDR: redis:6379
      EXCHANGES: bybit,okx
      LOG_LEVEL: debug
      LOG_FORMAT: json
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  trader:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
      target: trader
    networks: [gembo]
    environment:
      REDIS_ADDR: redis:6379
      EXCHANGES: bybit,okx
      DATABASE_URL: postgres://gembo:gembo@postgres:5432/gembo?sslmode=disable
      BYBIT_API_KEY: ${BYBIT_API_KEY}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET}
      OKX_API_KEY: ${OKX_API_KEY}
      OKX_API_SECRET: ${OKX_API_SECRET}
      OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE}
      TRADER_LEVERAGE: "1"
      TRADER_MARGIN_MODE: isolated
      LOG_LEVEL: debug
      LOG_FORMAT: json
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
