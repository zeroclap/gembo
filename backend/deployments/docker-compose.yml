# Dev stack: infrastructure + backend services
#
# Usage:
#   docker compose -f deployments/docker-compose.yml up

name: gembo

networks:
  gembo:
    driver: bridge

volumes:
  pgdata:
  redisinsight:
  gomodcache:
  gobuildcache:

services:

  # ---- infrastructure ----------------------------------------------------

  redis:
    image: redis:7-alpine
    networks: [gembo]
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    networks: [gembo]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gembo
      POSTGRES_PASSWORD: gembo
      POSTGRES_DB: gembo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gembo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    networks: [gembo]
    ports:
      - "5540:5540"
    volumes:
      - redisinsight:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- dependency warm-up ------------------------------------------------

  # One-shot init container: downloads all modules and compiles every dependency
  # in go.mod into the shared cache volumes. All services depend on it so deps
  # are only built once rather than in parallel per service.
  deps:
    image: golang:1.25-alpine
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/root/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    environment:
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: sh -c "go mod download && go build ./..."
    mem_limit: 8g
    restart: "no"

  # ---- backend services --------------------------------------------------

  # Market data collectors: one per exchange for isolation and independent restarts.
  # Each instance uses the EXCHANGES env var to limit to a single exchange.
  market-data-collector-bybit:
    image: golang:1.25-alpine
    networks: [gembo]
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/root/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    env_file:
      - ../.env
    environment:
      EXCHANGES: bybit
      REDIS_ADDR: redis:6379
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: go run ./cmd/market-data-collector
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  market-data-collector-okx:
    image: golang:1.25-alpine
    networks: [gembo]
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/root/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    env_file:
      - ../.env
    environment:
      EXCHANGES: okx
      REDIS_ADDR: redis:6379
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: go run ./cmd/market-data-collector
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  market-data-collector-binance:
    image: golang:1.25-alpine
    networks: [gembo]
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/root/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    env_file:
      - ../.env
    environment:
      EXCHANGES: binance
      REDIS_ADDR: redis:6379
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: go run ./cmd/market-data-collector
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  market-data-collector-gate:
    image: golang:1.25-alpine
    networks: [gembo]
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/root/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    env_file:
      - ../.env
    environment:
      EXCHANGES: gate
      REDIS_ADDR: redis:6379
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: go run ./cmd/market-data-collector
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "6060:6060" # pprof

  market-data-collector-htx:
    image: golang:1.25-alpine
    networks: [gembo]
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/root/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    env_file:
      - ../.env
    environment:
      EXCHANGES: htx
      REDIS_ADDR: redis:6379
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: go run ./cmd/market-data-collector
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  market-data-collector-aster:
    image: golang:1.25-alpine
    networks: [gembo]
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/root/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    env_file:
      - ../.env
    environment:
      EXCHANGES: aster
      REDIS_ADDR: redis:6379
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: go run ./cmd/market-data-collector
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Account data collector: positions/balances/funding via WebSocket. Requires API credentials.
  account-data-collector:
    image: golang:1.25-alpine
    networks: [gembo]
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/root/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    env_file:
      - ../.env
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://gembo:gembo@postgres:5432/gembo?sslmode=disable
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: go run ./cmd/account-data-collector
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: golang:1.25-alpine
    networks: [gembo]
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/root/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    env_file:
      - ../.env
    environment:
      REDIS_ADDR: redis:6379
      SERVER_HOST: "0.0.0.0"
      DATABASE_URL: postgres://gembo:gembo@postgres:5432/gembo?sslmode=disable
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
    ports:
      - "8080:8080"
    command: go run ./cmd/api
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  arbitrage-worker:
    image: golang:1.25-alpine
    networks: [gembo]
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/root/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    env_file:
      - ../.env
    environment:
      REDIS_ADDR: redis:6379
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: go run ./cmd/arbitrage-worker
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  position-manager:
    image: golang:1.25-alpine
    networks: [gembo]
    working_dir: /src
    volumes:
      - ..:/src
      - gomodcache:/root/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    env_file:
      - ../.env
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://gembo:gembo@postgres:5432/gembo?sslmode=disable
      GOMODCACHE: /root/go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: go run ./cmd/position-manager
    depends_on:
      deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
